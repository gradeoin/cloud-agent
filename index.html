<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuckBuck AI • Enterprise Neural Workspace</title>
  
  <!-- Dynamic SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8'/><stop offset='50%' stop-color='%23818cf8'/><stop offset='100%' stop-color='%23c084fc'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='%23131314'/><path d='M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6' stroke='url(%23g)' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <!-- Google Fonts: Google Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- KaTeX LaTeX Math Typesetting Engine -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            m3: {
              surface: '#131314',
              surfaceContainerLow: '#18181a',
              surfaceContainer: '#1e1f20',
              surfaceContainerHigh: '#282a2c',
              surfaceContainerHighest: '#333538',
              primary: '#a8c7fa',
              primaryContainer: '#0842a0',
              onSurface: '#e3e3e3',
              onSurfaceVariant: '#c4c7c5',
              outline: '#444746',
              outlineVariant: '#282a2c',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 100% INVISIBLE SCROLLBARS WORLDWIDE WHILE PRESERVING SMOOTH SCROLL */
    *, *::before, *::after {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }
    
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    
    /* ENHANCED READABLE FULL-WIDTH TYPOGRAPHY */
    .prose-readable {
      font-size: 15.5px;
      line-height: 1.75;
      color: #e3e3e3;
      width: 100%;
    }
    .prose-readable p {
      margin-bottom: 1.15em;
    }
    .prose-readable h1, .prose-readable h2, .prose-readable h3, .prose-readable h4 {
      color: #f1f3f4;
      font-weight: 600;
      margin-top: 1.4em;
      margin-bottom: 0.6em;
      letter-spacing: -0.01em;
    }
    .prose-readable h1 { font-size: 1.45em; color: #a8c7fa; }
    .prose-readable h2 { font-size: 1.25em; border-bottom: 1px solid rgba(68, 71, 70, 0.35); padding-bottom: 0.35em; }
    .prose-readable h3 { font-size: 1.1em; }
    .prose-readable ul, .prose-readable ol {
      margin-bottom: 1.15em;
      padding-left: 1.35em;
    }
    .prose-readable ul { list-style-type: disc; }
    .prose-readable ol { list-style-type: decimal; }
    .prose-readable li {
      margin-bottom: 0.45em;
    }
    .prose-readable blockquote {
      border-left: 3px solid #a8c7fa;
      background: rgba(168, 199, 250, 0.06);
      padding: 10px 16px;
      border-radius: 0 14px 14px 0;
      margin: 1.2em 0;
      color: #c4c7c5;
    }
    .prose-readable strong {
      color: #ffffff;
      font-weight: 600;
    }
    .prose-readable table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
      font-size: 0.9em;
    }
    .prose-readable th, .prose-readable td {
      border: 1px solid #282a2c;
      padding: 8px 12px;
      text-align: left;
    }
    .prose-readable th {
      background: #1e1f20;
      color: #a8c7fa;
      font-weight: 600;
    }
    
    .prose pre { background: #18181a !important; border: 1px solid #282a2c; padding: 14px; margin: 0 0 14px 0; border-radius: 16px; overflow-x: auto; }
    .prose code { color: #a8c7fa; font-family: 'JetBrains Mono', monospace; font-size: 0.88em; }
    .cursor-blink { display: inline-block; width: 6px; height: 15px; background: #a8c7fa; animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    .katex-display { margin: 1em 0; overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
    .katex { font-size: 1.08em; color: #e3e3e3; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 12px rgba(168, 199, 250, 0.4)); } 50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(168, 199, 250, 0.7)); } }

    .msg-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    .anim-spin { animation: spin-slow 10s linear infinite; }
    .anim-float { animation: float-slow 4s ease-in-out infinite; }
    .anim-glow { animation: pulse-glow 3s ease-in-out infinite; }

    #sidebar {
      width: 260px;
      min-width: 260px;
      transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
    }
    #sidebar.sidebar-hidden {
      width: 0px !important;
      min-width: 0px !important;
      border-right: none !important;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
  </style>
</head>
<body class="bg-m3-surface text-m3-onSurface flex h-screen w-screen overflow-hidden font-sans antialiased selection:bg-m3-primary/30 selection:text-m3-primary" onclick="closeAllDropdowns(event)">

  <!-- SILENT INITIAL AUTH CHECK LOADER -->
  <div id="auth-loading-screen" class="fixed inset-0 bg-m3-surface z-50 flex flex-col items-center justify-center space-y-4">
    <div class="w-14 h-14 rounded-2xl bg-m3-surfaceContainerHigh flex items-center justify-center shadow-xl anim-float">
      <svg class="w-7 h-7 text-m3-primary anim-glow" viewBox="0 0 32 32" fill="none">
        <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="flex items-center gap-2 text-xs text-m3-onSurfaceVariant font-medium">
      <svg class="w-4 h-4 text-m3-primary anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg>
      <span>Initializing workspace...</span>
    </div>
  </div>

  <!-- GOOGLE LOGIN SCREEN (Overlay) -->
  <div id="auth-overlay" class="fixed inset-0 bg-m3-surface/95 backdrop-blur-xl z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-m3-surfaceContainer border border-m3-outline/40 w-full max-w-sm rounded-[32px] p-8 shadow-2xl text-center space-y-6">
      
      <!-- Logo -->
      <div class="w-16 h-16 rounded-2xl bg-m3-surfaceContainerHigh border border-m3-outline/30 flex items-center justify-center mx-auto shadow-xl anim-float">
        <svg class="w-8 h-8 text-m3-primary anim-glow" viewBox="0 0 32 32" fill="none">
          <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div>
        <h2 class="text-xl font-semibold text-m3-onSurface tracking-tight">BuckBuck AI</h2>
        <p class="text-xs text-m3-onSurfaceVariant mt-1">Enterprise Neural Workspace</p>
      </div>

      <div id="auth-error-msg" class="hidden text-xs bg-rose-500/10 text-rose-300 border border-rose-500/20 p-3 rounded-2xl text-left font-medium"></div>

      <button id="google-login-btn" onclick="handleGoogleSignIn()" class="w-full bg-white hover:bg-slate-100 active:scale-95 text-slate-900 font-medium py-3 px-4 rounded-full text-sm flex items-center justify-center gap-3 transition shadow-md">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.4 8.9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
          <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.6 6.4C.6 8.3 0 10.5 0 12s.6 3.7 1.6 5.6l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.4-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- COLLAPSIBLE GOOGLE MATERIAL 3 SIDEBAR -->
  <aside id="sidebar" class="bg-m3-surfaceContainerLow border-r border-m3-outline/20 flex flex-col z-30 shrink-0 md:static fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 overflow-hidden select-none">
    
    <!-- Unified Sidebar Header -->
    <div class="px-3.5 py-3 flex items-center gap-2.5 min-w-[260px]">
      <button onclick="toggleSidebar()" class="text-m3-onSurfaceVariant hover:text-m3-onSurface p-2 rounded-full hover:bg-m3-surfaceContainer transition" title="Collapse sidebar">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-m3-surfaceContainerHigh flex items-center justify-center text-m3-primary shrink-0 shadow-sm">
          <svg class="w-3.5 h-3.5" viewBox="0 0 32 32" fill="none">
            <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="font-semibold text-sm tracking-tight text-m3-onSurface whitespace-nowrap">BuckBuck</span>
      </div>
    </div>

    <!-- M3 Pill "New Chat" Action -->
    <div class="px-3 py-1.5 min-w-[260px]">
      <button onclick="startNewChat()" class="w-full bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh text-m3-onSurface hover:text-white font-medium px-4 py-2.5 rounded-full text-xs flex items-center gap-3 transition shadow-sm border border-m3-outline/30 active:scale-98 whitespace-nowrap">
        <svg class="w-4 h-4 text-m3-primary shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>
    </div>

    <!-- Conversation History List -->
    <div class="flex-1 overflow-y-auto px-2 py-2 space-y-0.5 min-w-[260px]" id="chat-history-list">
      <div class="text-[11px] font-medium text-m3-onSurfaceVariant px-3 py-1.5 whitespace-nowrap">Recent</div>
      <div id="history-items" class="space-y-0.5"></div>
    </div>

    <!-- M3 Account Footer -->
    <div class="p-2 border-t border-m3-outline/20 bg-m3-surfaceContainerLow min-w-[260px]">
      <div class="flex items-center justify-between p-2 rounded-2xl bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh transition">
        <div class="flex items-center gap-2.5 min-w-0">
          <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="w-7 h-7 rounded-full bg-m3-surfaceContainerHighest border border-m3-outline/30 shrink-0">
          <div class="min-w-0">
            <div id="user-name" class="font-medium text-xs text-m3-onSurface truncate">Admin</div>
            <div id="firebase-status" class="text-[10px] text-m3-onSurfaceVariant truncate">Firestore synced</div>
          </div>
        </div>
        <button onclick="handleSignOut()" class="text-m3-onSurfaceVariant hover:text-rose-400 p-1.5 rounded-full hover:bg-m3-surfaceContainerHighest transition" title="Sign out">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Sidebar Overlay for Mobile -->
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden md:hidden"></div>

  <!-- MAIN CHAT & WORKSPACE AREA -->
  <div class="flex-1 flex flex-col h-screen w-full min-w-0 bg-m3-surface relative overflow-hidden">
    
    <!-- Main Header -->
    <header class="bg-[#131314]/90 backdrop-blur-xl px-3 sm:px-6 py-2.5 flex justify-between items-center z-10 border-b border-white/[0.07] shrink-0">
      <div class="flex items-center gap-2">
        <!-- Hamburger Button -->
        <button id="main-hamburger-btn" onclick="toggleSidebar()" class="w-8 h-8 rounded-xl bg-[#1e1f20] hover:bg-[#282a2c] border border-white/[0.08] text-m3-onSurfaceVariant hover:text-white flex items-center justify-center transition hidden" title="Expand sidebar">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>

        <!-- ACTIVE FLAGSHIP MODEL BADGE -->
        <div class="flex items-center gap-2 bg-[#1e1f20] border border-white/[0.08] h-8 px-3 rounded-xl text-xs font-medium text-white shadow-sm select-none">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-medium">Qwen 2.5 Coder (7B)</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-normal hidden sm:inline-block">🏆 Web & Apps</span>
        </div>

        <!-- GPU / System Health Badge -->
        <span id="status-badge" class="text-[11px] h-8 px-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono font-medium hidden sm:inline-flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span>T4 GPU</span>
        </span>
      </div>

      <!-- Unified Controls Toolbar -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Live Search Toggle Button -->
        <button id="websearch-btn" onclick="toggleWebSearch()" class="flex items-center gap-1.5 h-8 px-2.5 sm:px-3 rounded-xl text-xs font-medium bg-[#1e1f20] hover:bg-[#282a2c] text-m3-onSurfaceVariant hover:text-white border border-white/[0.08] transition active:scale-95 cursor-pointer" title="Toggle Live Web Grounding">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span class="hidden sm:inline">Search</span>
        </button>

        <!-- Artifacts Studio Button -->
        <button onclick="toggleArtifactDrawerQuick()" class="flex items-center gap-1.5 h-8 px-2.5 sm:px-3 rounded-xl text-xs font-medium bg-[#1e1f20] hover:bg-[#282a2c] text-m3-primary border border-m3-primary/25 hover:border-m3-primary/50 transition active:scale-95 shadow-sm cursor-pointer" title="Open Artifact Studio">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
          <span class="hidden sm:inline">Artifacts</span>
        </button>

        <div class="h-4 w-px bg-white/10 mx-0.5 hidden sm:block"></div>

        <!-- Export Chat as HTML -->
        <button onclick="exportChatAsHTML()" class="w-8 h-8 rounded-xl bg-[#1e1f20] hover:bg-[#282a2c] border border-white/[0.08] text-m3-onSurfaceVariant hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer" title="Export conversation as HTML document">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>

        <!-- Settings Button -->
        <button onclick="toggleSettingsModal()" class="w-8 h-8 rounded-xl bg-[#1e1f20] hover:bg-[#282a2c] border border-white/[0.08] text-m3-onSurfaceVariant hover:text-white flex items-center justify-center transition active:scale-95 cursor-pointer" title="Settings">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Scroll Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-7 max-w-5xl w-full mx-auto relative">
      
      <!-- Minimal Gemini-Style Welcome Header -->
      <div id="welcome-banner" class="space-y-4 pt-16 pb-6 msg-fade-in">
        <div class="w-10 h-10 rounded-2xl bg-m3-surfaceContainerHigh border border-m3-outline/20 flex items-center justify-center mb-3 shadow-md">
          <svg class="w-5 h-5 text-m3-primary" viewBox="0 0 32 32" fill="none">
            <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="text-3xl sm:text-4xl font-medium tracking-tight text-m3-onSurface">
          <span class="text-m3-primary">Hello,</span>
        </h2>
        <p class="text-2xl sm:text-3xl font-medium text-m3-onSurfaceVariant">How can I help you today?</p>
      </div>
    </main>

    <!-- Floating Scroll-To-Bottom Indicator -->
    <div id="scroll-bottom-container" class="absolute bottom-24 right-8 z-20 hidden">
      <button onclick="scrollToBottom(true)" class="bg-m3-surfaceContainerHigh hover:bg-m3-surfaceContainerHighest text-m3-primary p-2.5 rounded-full shadow-xl border border-m3-outline/40 flex items-center gap-2 text-xs font-medium transition hover:scale-105 active:scale-95">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        <span class="pr-1 text-xs text-m3-onSurface">Bottom</span>
      </button>
    </div>

    <!-- M3 Floating Pill Input Bar -->
    <footer class="p-3 sm:p-5 bg-gradient-to-t from-m3-surface via-m3-surface to-transparent">
      <div class="max-w-5xl mx-auto space-y-2">
        <!-- Attachment Chips Container -->
        <div class="flex items-center gap-2 flex-wrap">

  <script>
    const defaultFirebaseConfig = {

    let backendUrl = localStorage.getItem("ai_backend_url") || "https://promo-argued-induced-positions.trycloudflare.com";
    let backendApiKey = localStorage.getItem("ai_backend_key") || "";
    let modelName = localStorage.getItem("ai_model_name") || "qwen2.5-coder:7b";
    let allowedEmail = localStorage.getItem("ai_allowed_email") || "";

    // 🚀 AUTOMATIC 1-CLICK COLAB AUTO-CONNECT FROM URL PARAMETERS
    try {

        const newUrl = (urlParams.get("colab") || urlParams.get("url")).trim().replace(/\/+$/, "");
        if (newUrl.startsWith("http")) {

          localStorage.setItem("ai_backend_url", backendUrl);
          autoConnected = true;
        }
      }
      if (urlParams.has("key") || urlParams.has("api_key")) {
        const newKey = (urlParams.get("key") || urlParams.get("api_key")).trim();
        if (newKey) {
          backendApiKey = newKey;
          localStorage.setItem("ai_backend_key", backendApiKey);
          autoConnected = true;
        }
      }
      if (autoConnected) {
        // Clean URL in address bar without reloading
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
        setTimeout(() => {
          if (typeof showToast === 'function') showToast("⚡ Auto-connected to Colab GPU Backend!");
        }, 500);
      }
    } catch (e) {
      console.warn("URL param auto-connect:", e);
    }

    let currentChatId = getChatIdFromURL() || "chat_" + Date.now();
    let db = null, auth = null, currentUser = null;
    let conversations = JSON.parse(localStorage.getItem("ai_conversations") || "{}");
    let currentAttachedFile = null;
    let activeArtifactCode = "";
    let activeArtifactTitle = "Artifact Preview";
    let activeArtifactLang = "html";
    
    function getAuthHeaders(extra = {}) {
      const headers = { "Content-Type": "application/json", ...extra };
      if (backendApiKey) {
        headers["X-API-Key"] = backendApiKey;
        headers["Authorization"] = `Bearer ${backendApiKey}`;
      }
      return headers;
    }
    
    // SAFE IN-MEMORY REGISTRY TO PREVENT QUOTE/ESCAPING BUGS & SUPPORT MULTI-FILE BUNDLING
    window.codeRegistry = {};
    let snippetIdCounter = 0;
    const rawMessageStore = {};

    const EXT_MAP = {
      python: 'py', py: 'py', javascript: 'js', js: 'js', jsx: 'jsx', typescript: 'ts', ts: 'ts', tsx: 'tsx',
      html: 'html', htm: 'html', css: 'css', json: 'json', markdown: 'md', md: 'md',
      sql: 'sql', bash: 'sh', sh: 'sh', shell: 'sh', svg: 'svg', xml: 'xml',
      c: 'c', cpp: 'cpp', rust: 'rs', rs: 'rs', java: 'java', go: 'go', csv: 'csv', text: 'txt'
    };

    let isWebSearchEnabled = false;

    function toggleWebSearch() {
      isWebSearchEnabled = !isWebSearchEnabled;
      const btn = document.getElementById("websearch-btn");
      if (isWebSearchEnabled) {
        btn.className = "flex items-center gap-1.5 h-8 px-2.5 sm:px-3 rounded-xl text-xs font-medium bg-m3-primary/20 text-m3-primary border border-m3-primary/50 shadow-[0_0_12px_rgba(168,199,250,0.25)] transition active:scale-95 cursor-pointer";

        btn.className = "flex items-center gap-1.5 h-8 px-2.5 sm:px-3 rounded-xl text-xs font-medium bg-[#1e1f20] hover:bg-[#282a2c] text-m3-onSurfaceVariant hover:text-white border border-white/[0.08] transition active:scale-95 cursor-pointer";
        btn.title = "Live Web Search Grounding: Disabled";
        showToast("Live Web Search Disabled");
      }
    }

    function toggleModelDropdown() {
      const menu = document.getElementById("model-dropdown-menu");
      const arrow = document.getElementById("model-dropdown-arrow");
      if (menu) menu.classList.toggle("hidden");
      if (arrow) arrow.classList.toggle("rotate-180");
    }

    function closeAllDropdowns() {
      const menu = document.getElementById("model-dropdown-menu");
      const arrow = document.getElementById("model-dropdown-arrow");
      if (menu && !menu.classList.contains("hidden")) {
        menu.classList.add("hidden");
      }
      if (arrow) arrow.classList.remove("rotate-180");
    }

    function selectModel(tag, label) {
      modelName = tag;
      localStorage.setItem("ai_model_name", modelName);
      const inputEl = document.getElementById("model-name-input");
      if (inputEl) inputEl.value = modelName;
      const dispEl = document.getElementById("current-model-display");
      if (dispEl) dispEl.textContent = label;
      closeAllDropdowns();
    }

    function updateModelDisplayFromStorage() {
      const dispEl = document.getElementById("current-model-display");
      if (dispEl) {
        dispEl.textContent = "Qwen 2.5 Coder (7B)";
      }
    }

    function getChatIdFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get('c');
      if (queryId) return queryId;
      const hashMatch = window.location.hash.match(/#\/?c\/(.+)/);
      if (hashMatch) return hashMatch[1];
      return null;
    }

    function updateChatURL(chatId) {
      if (!chatId) {
        window.history.pushState({}, "", window.location.pathname);
      } else {
        window.history.pushState({ chatId }, "", `?c=${chatId}`);
      }
    }

    window.addEventListener('popstate', (e) => {
      const idFromURL = getChatIdFromURL();
      if (idFromURL && conversations[idFromURL]) {
        loadChatSession(idFromURL, false);
      } else if (!idFromURL) {
        startNewChat(false);
      }
    });

    // SMART AUTO-SCROLL
    let isUserScrolledUp = false;
    const chatContainer = document.getElementById("chat-container");
    const scrollBottomBtn = document.getElementById("scroll-bottom-container");

    chatContainer.addEventListener("scroll", function() {
      const threshold = 140;
      const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight <= threshold;
      isUserScrolledUp = !isAtBottom;
      if (isUserScrolledUp) {
        scrollBottomBtn.classList.remove("hidden");
      } else {
        scrollBottomBtn.classList.add("hidden");
      }
    });

    function scrollToBottom(force = false) {
      if (!isUserScrolledUp || force) {
        chatContainer.scrollTo({
          top: chatContainer.scrollHeight,
          behavior: force ? 'smooth' : 'auto'
        });
        if (force) {
          isUserScrolledUp = false;
          scrollBottomBtn.classList.add("hidden");
        }
      }
    }

    try {
      const uEl = document.getElementById("backend-url-input");
      if (uEl) uEl.value = backendUrl;
      const kEl = document.getElementById("backend-key-input");
      if (kEl) kEl.value = backendApiKey;
      const mEl = document.getElementById("model-name-input");
      if (mEl) mEl.value = modelName;
      const eEl = document.getElementById("allowed-email-input");
      if (eEl) eEl.value = allowedEmail;
      updateModelDisplayFromStorage();
    } catch(e) {}

    // GLOBAL SAFETY DISMISSAL FOR AUTH LOADER
    setTimeout(() => {
      const loader = document.getElementById("auth-loading-screen");
      if (loader && !loader.classList.contains("hidden")) {
        loader.classList.add("hidden");
      }
    }, 1200);

    // PERSISTENT AUTHENTICATION
    function initFirebase() {
      try {
        if (!window.firebase || !defaultFirebaseConfig.apiKey) {
          const loader = document.getElementById("auth-loading-screen");
          if (loader) loader.classList.add("hidden");
          return;
        }
        if (!firebase.apps.length) firebase.initializeApp(defaultFirebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
          auth.onAuthStateChanged(user => {
            const loader = document.getElementById("auth-loading-screen");
            if (loader) loader.classList.add("hidden");
            if (user) {
              if (allowedEmail && user.email.toLowerCase() !== allowedEmail.toLowerCase()) {
                showAuthError(`Access Denied: ${user.email} is not authorized.`);
                auth.signOut();
                return;
              }
              if (!allowedEmail) {
                allowedEmail = user.email.toLowerCase();
                localStorage.setItem("ai_allowed_email", allowedEmail);
                const eEl = document.getElementById("allowed-email-input");
                if (eEl) eEl.value = allowedEmail;
              }
              currentUser = user;
              const overlay = document.getElementById("auth-overlay");
              if (overlay) overlay.classList.add("hidden");
              const nameEl = document.getElementById("user-name");
              if (nameEl) nameEl.textContent = user.displayName || user.email;
              if (user.photoURL) {
                const avEl = document.getElementById("user-avatar");
                if (avEl) avEl.src = user.photoURL;
              }
              
              loadFirestoreConversations();
            } else {
              currentUser = null;
              const overlay = document.getElementById("auth-overlay");
              if (overlay) overlay.classList.remove("hidden");
            }
          });
        }).catch(() => {
          const loader = document.getElementById("auth-loading-screen");
          if (loader) loader.classList.add("hidden");
        });

      } catch (e) {
        console.warn("Firebase note:", e);
        const loader = document.getElementById("auth-loading-screen");
        if (loader) loader.classList.add("hidden");
      }
    }
    initFirebase();

    function handleGoogleSignIn() {
      const provider = new firebase.auth.GoogleAuthProvider();
      hideAuthError();
      auth.signInWithPopup(provider).catch(err => {
        showAuthError(err.message || "Failed to sign in with Google.");
      });
    }

    function handleSignOut() { auth.signOut(); }
    function showAuthError(msg) {
      const errBox = document.getElementById("auth-error-msg");
      errBox.textContent = msg;
      errBox.classList.remove("hidden");
    }
    function hideAuthError() { document.getElementById("auth-error-msg").classList.add("hidden"); }

    const promptInput = document.getElementById("prompt-input");
    promptInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });
    promptInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const mainHamburger = document.getElementById("main-hamburger-btn");

        sidebar.classList.toggle("sidebar-hidden");
        const isHidden = sidebar.classList.contains("sidebar-hidden");

          mainHamburger.classList.remove("hidden");
        } else {
          mainHamburger.classList.add("hidden");
        }
      } else {
        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
      }
    }

    function toggleSettingsModal() {
      document.getElementById("settings-modal").classList.toggle("hidden");
    }

    function saveSettings() {
      backendUrl = document.getElementById("backend-url-input").value.trim().replace(/\/$/, "");
      backendApiKey = document.getElementById("backend-key-input").value.trim();
      modelName = document.getElementById("model-name-input").value.trim();
      allowedEmail = document.getElementById("allowed-email-input").value.trim().toLowerCase();

      localStorage.setItem("ai_backend_url", backendUrl);
      localStorage.setItem("ai_backend_key", backendApiKey);
      localStorage.setItem("ai_model_name", modelName);
      localStorage.setItem("ai_allowed_email", allowedEmail);

      updateModelDisplayFromStorage();
      toggleSettingsModal();
      checkBackendStatus();

        reader.onload = function(evt) {
          currentAttachedImage = {

        reader.onload = function(evt) {
          currentAttachedFile = {

            size: (file.size / 1024).toFixed(1) + " KB",

    // REAL-TIME VOICE INPUT (Speech-to-Text)
    let speechRecognition = null;
    let isRecordingVoice = false;

    function toggleVoiceRecording() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome, Edge, or Brave.");
        return;
      }

      const voiceBtn = document.getElementById("voice-input-btn");

      if (!isRecordingVoice) {
        speechRecognition = new SpeechRecognition();
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.lang = 'en-US';

        speechRecognition.onstart = function() {
          isRecordingVoice = true;
          voiceBtn.className = "w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center transition font-bold shrink-0 animate-pulse shadow-[0_0_15px_rgba(244,63,94,0.5)] cursor-pointer";
          showToast("Listening... speak naturally.");
        };

        speechRecognition.onresult = function(event) {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            transcript += event.results[i][0].transcript;
          }
          const promptInput = document.getElementById("prompt-input");
          promptInput.value = (promptInput.value.trim() ? promptInput.value.trim() + " " : "") + transcript;
          promptInput.style.height = "auto";
          promptInput.style.height = promptInput.scrollHeight + "px";
        };

        speechRecognition.onerror = function(event) {
          console.warn("Speech recognition note:", event.error);
          stopVoiceRecording();
        };

        speechRecognition.onend = function() {
          stopVoiceRecording();
        };

        speechRecognition.start();
      } else {
        stopVoiceRecording();
      }
    }

    function stopVoiceRecording() {
      isRecordingVoice = false;
      if (speechRecognition) {
        try { speechRecognition.stop(); } catch(e){}
      }
      const voiceBtn = document.getElementById("voice-input-btn");
      if (voiceBtn) {
        voiceBtn.className = "w-8 h-8 rounded-full bg-m3-surfaceContainerHigh hover:bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:text-m3-primary flex items-center justify-center transition shrink-0 active:scale-95 shadow-sm cursor-pointer";

    // TEXT-TO-SPEECH (READ ALOUD)
    function readAloudMessage(msgId, btnEl) {
      if (!window.speechSynthesis) return alert("Text-to-speech not supported in this browser.");

      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        if (btnEl) {
          const span = btnEl.querySelector("span");
          if (span) span.textContent = "Speak";
        }
        return;
      }

      const rawText = rawMessageStore[msgId];
      if (!rawText) return;
      const clean = rawText
        .replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, "")
        .replace(/```[\s\S]*?```/g, "Code block omitted.")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/[\*#_]/g, "")
        .trim();

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.rate = 1.05;
      utterance.pitch = 1.0;

      utterance.onstart = () => {
        if (btnEl) {
          const span = btnEl.querySelector("span");
          if (span) span.textContent = "Stop";
        }
      };
      utterance.onend = () => {
        if (btnEl) {
          const span = btnEl.querySelector("span");
          if (span) span.textContent = "Speak";
        }
      };
      utterance.onerror = () => {
        if (btnEl) {
          const span = btnEl.querySelector("span");
          if (span) span.textContent = "Speak";
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function buildCombinedWebApp(htmlCode = "", cssCode = "", jsCode = "") {
      let baseHtml = htmlCode.trim();
      if (!baseHtml) {
        baseHtml = `<div class="p-8 text-center"><h1 class="text-2xl font-bold">Interactive Web App</h1></div>`;
      }

      const hasDoctype = baseHtml.toLowerCase().includes('<!doctype') || baseHtml.toLowerCase().includes('<html');

      if (!hasDoctype) {
        return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ${cssCode ? `\n/* Custom Styles */\n${cssCode}\n` : ''}
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  ${baseHtml}
  ${jsCode ? `<script>\n// Custom Application Logic\n${jsCode}\n<\/script>` : ''}
  <script>if(window.lucide) lucide.createIcons();<\/script>
</body>
</html>`;
      } else {
        let compiled = baseHtml;
        if (cssCode && !compiled.includes(cssCode)) {
          if (compiled.includes('</head>')) {
            compiled = compiled.replace('</head>', `<style>\n${cssCode}\n</style>\n</head>`);
          } else {
            compiled = `<style>\n${cssCode}\n</style>\n` + compiled;
          }
        }
        if (jsCode && !compiled.includes(jsCode)) {
          if (compiled.includes('</body>')) {
            compiled = compiled.replace('</body>', `<script>\n${jsCode}\n<\/script>\n</body>`);
          } else {
            compiled = compiled + `\n<script>\n${jsCode}\n<\/script>`;
          }
        }
        return compiled;
      }
    }

    // LIVE PYTHON GPU EXECUTION ON COLAB BACKEND
    async function runPythonOnBackend(snipId, buttonEl) {
      const item = window.codeRegistry[snipId];
      if (!item) return;

      // Find nearest suitable parent container (works for both code header and bottom artifact card)
      const parentContainer = buttonEl.closest('.mt-4') || buttonEl.closest('.code-header-bar')?.parentElement || buttonEl.closest('.p-3.5') || buttonEl.parentElement;
      if (!parentContainer) return;

      let termBox = parentContainer.nextElementSibling;
      if (!termBox || !termBox.classList.contains('python-terminal-box')) {
        termBox = document.createElement('div');
        termBox.className = 'python-terminal-box mt-3 mb-4 p-4 rounded-2xl bg-[#0e1015] border border-emerald-500/30 font-mono text-xs shadow-xl space-y-3';
        parentContainer.parentNode.insertBefore(termBox, parentContainer.nextSibling);
      }

      termBox.innerHTML = `
        <div class="flex items-center justify-between border-b border-white/10 pb-2 text-emerald-400 font-semibold">
          <span class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg>
            Executing on Colab T4 GPU...
          </span>
          <span class="text-[10px] text-m3-onSurfaceVariant">/api/exec</span>
        </div>
      `;

      try {
        const res = await fetch(`${backendUrl}/api/exec`, {
          method: "POST",
          headers: getAuthHeaders(),
          body: JSON.stringify({ code: item.code })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        let plotsHtml = "";
        if (data.plots && data.plots.length > 0) {
          plotsHtml = `<div class="pt-2 grid grid-cols-1 sm:grid-cols-2 gap-3">`;
          data.plots.forEach(b64 => {
            plotsHtml += `
              <div class="rounded-xl overflow-hidden border border-white/10 bg-white p-2 shadow-lg">
                <img src="data:image/png;base64,${b64}" class="w-full h-auto object-contain rounded-lg">
              </div>
            `;
          });
          plotsHtml += `</div>`;
        }

        const statusColor = data.success ? "text-emerald-400" : "text-rose-400";
        const statusText = data.success ? `Execution Succeeded (${data.execution_time_seconds}s)` : "Execution Error";

        termBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <span class="font-semibold text-xs flex items-center gap-1.5 ${statusColor}">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
              ${statusText}
            </span>
            <button onclick="this.closest('.python-terminal-box').remove()" class="text-m3-onSurfaceVariant hover:text-white text-xs cursor-pointer">Close</button>
          </div>
          ${data.stdout ? `<div class="text-slate-200 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto">${data.stdout}</div>` : ''}
          ${data.stderr ? `<div class="text-rose-300 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto bg-rose-950/20 p-2 rounded-lg border border-rose-500/20">${data.stderr}</div>` : ''}
          ${(!data.stdout && !data.stderr && data.success) ? `<div class="text-gray-400 italic">Script executed with no console output.</div>` : ''}
          ${plotsHtml}
        `;

      } catch (err) {
        termBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-white/10 pb-2 text-rose-400 font-semibold text-xs">
            <span>Execution Failed</span>
            <button onclick="this.closest('.python-terminal-box').remove()" class="text-m3-onSurfaceVariant hover:text-white text-xs cursor-pointer">Close</button>
          </div>
          <div class="text-rose-300 text-xs">Could not reach Colab Python executor. Ensure the updated backend is running.</div>
        `;
      }
    }

    function downloadFileContent(content, filename, mimeType = "text/html;charset=utf-8") {
      const blob = new Blob([content], { type: mimeType });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename || "download.html";
      a.click();
      URL.revokeObjectURL(a.href);
      showToast(`Downloaded ${filename}!`);
    }

    function copyToClipboardSafe(text) {
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.top = "-9999px";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
    }

    async function searchDuckDuckGo(query) {
      try {
        const cleanQuery = query.replace(/[^\w\s]/gi, ' ').trim();
        const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(cleanQuery)}&format=json&no_html=1&skip_disambig=1`);
        const data = await res.json();
        let context = "";
        if (data.AbstractText) context += `Summary: ${data.AbstractText}\n`;
        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          context += "Related Search Results:\n";
          data.RelatedTopics.slice(0, 4).forEach(t => { 
            if (t.Text) context += `- ${t.Text}\n`; 
            if (t.Topics && Array.isArray(t.Topics)) {
              t.Topics.slice(0, 2).forEach(st => { if (st.Text) context += `- ${st.Text}\n`; });
            }
          });
        }

        // Fallback to Wikipedia summary if DDG returned no direct abstract
        if (!context || context.length < 50) {
          const firstTerm = cleanQuery.split(' ').slice(0, 2).join(' ');
          const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(firstTerm)}`);
          if (wikiRes.ok) {
            const wikiData = await wikiRes.json();
            if (wikiData.extract) context += `\nWikipedia Overview (${wikiData.title}):\n${wikiData.extract}`;
          }
        }
        return context.trim();
      } catch (err) { return ""; }
    }

CORE DIRECTIVES FOR WORLD-CLASS WEBSITES & APPS:

        if (isPython) {
          runPythonBtn = `
            <button type="button" onclick="runPythonOnBackend('${snipId}', this)" 
              class="hover:text-emerald-400 flex items-center gap-1 text-xs font-sans font-medium text-emerald-400 transition cursor-pointer" title="Execute script on Google Colab T4 GPU">
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>Run GPU</span>
            </button>
          `;
        }

        header.innerHTML = `
          <span class="text-m3-onSurfaceVariant font-bold uppercase tracking-wider text-[10px]">${lang}</span>
          <div class="flex items-center gap-3">
            ${runPythonBtn}
            <button type="button" onclick="previewSnippet('${snipId}')" 
              class="hover:text-m3-primary flex items-center gap-1.5 text-xs font-sans font-medium text-m3-primary transition cursor-pointer" title="Preview / Run in Sandbox">
              <svg class="w-3.5 h-3.5 text-m3-primary fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>${previewBtnLabel}</span>
            </button>
            <button type="button" onclick="downloadSnippet('${snipId}')" 
              class="hover:text-white flex items-center gap-1 text-xs font-sans font-medium text-m3-onSurfaceVariant transition cursor-pointer" title="Download as ${filename}">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span>Download</span>
            </button>
            <button type="button" onclick="copySnippet(this, '${snipId}')" 
              class="hover:text-white flex items-center gap-1 text-xs font-sans font-medium text-m3-onSurfaceVariant transition cursor-pointer" title="Copy code">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span>Copy</span>
            </button>
          </div>
        `;

        pre.parentNode.insertBefore(header, pre);
        pre.classList.add('rounded-t-none', 'mt-0', 'border-t-0');
        hljs.highlightElement(codeEl);
      });
    }

    function renderResponseWithArtifacts(text, msgId = "") {
      let thinkHtml = "";
      let mainText = text;

      const thinkMatch = text.match(/<think>([\s\S]*?)(?:<\/think>|$)/i);
      if (thinkMatch) {
        const thinkContent = thinkMatch[1].trim();
        const isStillThinking = !text.includes("</think>");
        mainText = text.replace(/<think>[\s\S]*?(?:<\/think>|$)/i, "").trim();

        if (isStillThinking) {
          thinkHtml = `
            <div class="mb-4 bg-m3-surfaceContainerLow border border-m3-outline/30 rounded-2xl p-3.5 shadow-sm">
              <div class="flex items-center gap-2 text-xs font-medium text-m3-primary mb-2">
                <svg class="w-3.5 h-3.5 anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg>
                Thinking in real-time...
              </div>
              <div class="text-xs text-m3-onSurfaceVariant/90 font-mono whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto">
                ${thinkContent || 'Generating initial reasoning tokens...'}
              </div>
            </div>
          `;
        } else if (thinkContent.length > 0) {
          thinkHtml = `
            <details class="mb-4 bg-m3-surfaceContainerLow border border-m3-outline/20 rounded-2xl overflow-hidden group shadow-sm">
              <summary class="px-4 py-2.5 cursor-pointer font-medium text-xs text-m3-primary flex items-center justify-between select-none hover:bg-m3-surfaceContainer transition">
                <span class="flex items-center gap-2">
                  <svg class="w-3.5 h-3.5 text-m3-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 00-8 8c0 3 2 5.5 4 7v3h8v-3c2-1.5 4-4 4-7a8 8 0 00-8-8z"/><path d="M9 22h6"/></svg>
                  Thought Process (${Math.max(1, Math.round(thinkContent.split(' ').length / 20))}s)
                </span>
                <svg class="w-3.5 h-3.5 text-m3-onSurfaceVariant transition-transform group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>
              </summary>
              <div class="px-4 py-3 border-t border-m3-outline/20 text-xs text-m3-onSurfaceVariant/85 font-mono whitespace-pre-wrap leading-relaxed bg-[#151517]">
                ${thinkContent}
              </div>
            </details>
          `;
        }
      }

      let normalized = mainText
        .replace(/\[\s*(\\text|\\boxed|\\begin|\\frac|\\sum|\\int|\\sqrt|\\alpha|\\beta|\\gamma|\\theta|\\lambda|\\sigma|\\omega|\\mathbf|\\mathcal|\\left|\\mathbf|Attention)[\s\S]*?\]/g, match => {
          return `\n$$\n${match.slice(1, -1).trim()}\n$$\n`;
        })
        .replace(/\(\s*([QKVqkvi-z0-9\\]+)\s*\)/g, (match, p1) => {
          if (p1.length <= 4 || p1.startsWith('\\')) return `$${p1}$`;
          return match;
        });

      let parsedHtml = marked.parse(normalized);

      // MULTI-SNIPPET PARSER: EXTRACT ALL HTML, CSS, AND JS BLOCKS
      const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g;
      let match;
      let htmlSnippets = [];
      let cssSnippets = [];
      let jsSnippets = [];
      let totalBlocks = 0;

      while ((match = codeBlockRegex.exec(mainText)) !== null) {
        totalBlocks++;
        const lang = (match[1] || 'code').toLowerCase();
        const codeContent = match[2].trim();
        if (['html', 'htm'].includes(lang)) htmlSnippets.push(codeContent);
        else if (lang === 'css') cssSnippets.push(codeContent);
        else if (['js', 'javascript', 'jsx'].includes(lang)) jsSnippets.push(codeContent);
      }

      const hasMultiWebFiles = (htmlSnippets.length > 0 && (cssSnippets.length > 0 || jsSnippets.length > 0)) || (totalBlocks > 1 && (htmlSnippets.length + cssSnippets.length + jsSnippets.length >= 2));

      if (hasMultiWebFiles && msgId) {
        const combinedHTML = buildCombinedWebApp(
          htmlSnippets.join('\n\n'),
          cssSnippets.join('\n\n'),
          jsSnippets.join('\n\n')
        );

        const bundleId = 'bundle_' + msgId;
        window.codeRegistry[bundleId] = {
          code: combinedHTML,
          lang: 'html',
          filename: `full_webapp_${Date.now()}.html`,
          isBundle: true
        };

        const bundleCard = `
          <div class="mt-5 p-4 rounded-2xl bg-gradient-to-r from-indigo-950/40 via-m3-surfaceContainer to-indigo-950/30 border border-indigo-500/30 flex items-center justify-between shadow-lg flex-wrap gap-3">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-xl bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 flex items-center justify-center shadow-inner">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
              </div>
              <div>
                <div class="font-medium text-xs text-white flex items-center gap-2">
                  <span>Interactive Full-Stack Web App</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 font-normal">HTML + CSS + JS Unified</span>
                </div>
                <div class="text-[11px] text-m3-onSurfaceVariant mt-0.5">Automatically merged separate files into a working executable sandbox</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="downloadSnippet('${bundleId}')" 
                class="px-3.5 py-1.5 rounded-full bg-m3-surfaceContainerHigh hover:bg-m3-surfaceContainerHighest text-m3-onSurface font-medium text-xs transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                <span>Download App (.html)</span>
              </button>
              <button type="button" onclick="previewSnippet('${bundleId}')" 
                class="px-4 py-1.5 rounded-full bg-indigo-500 hover:bg-indigo-400 text-white font-semibold text-xs transition flex items-center gap-1.5 active:scale-95 shadow-md shadow-indigo-500/20 cursor-pointer">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Live Preview Unified App</span>
              </button>
            </div>
          </div>
        `;
        parsedHtml += bundleCard;

      } else {
        const codeMatch = mainText.match(/```(\w+)?\n([\s\S]*?)```/);
        if (codeMatch && codeMatch[2].trim().length > 40) {
          const lang = (codeMatch[1] || 'code').toLowerCase();
          const rawCode = codeMatch[2].trim();
          const ext = EXT_MAP[lang] || 'txt';
          const autoFilename = `generated_file_${Date.now()}.${ext}`;
          const cardId = 'card_' + (msgId || 'art') + '_' + (++snippetIdCounter);

          window.codeRegistry[cardId] = {
            code: rawCode,
            lang: lang,
            filename: autoFilename
          };

          const isPython = ['python', 'py'].includes(lang);

          const artifactPill = `
            <div class="mt-4 p-3.5 rounded-2xl bg-m3-surfaceContainer border border-m3-outline/30 flex items-center justify-between shadow-sm flex-wrap gap-2">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-m3-surfaceContainerHighest text-m3-primary flex items-center justify-center">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
                </div>
                <div>
                  <div class="font-medium text-xs text-m3-onSurface">${autoFilename}</div>
                  <div class="text-[10px] text-m3-onSurfaceVariant">${lang.toUpperCase()} • ${(rawCode.length / 1024).toFixed(1)} KB</div>
                </div>
              </div>
              <div class="flex items-center gap-1.5">
                ${isPython ? `
                  <button type="button" onclick="runPythonOnBackend('${cardId}', this)" 
                    class="px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 hover:bg-emerald-500/20 font-medium text-xs transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span>Run on GPU</span>
                  </button>
                ` : ''}
                <button type="button" onclick="downloadSnippet('${cardId}')" 
                  class="px-3 py-1.5 rounded-full bg-m3-surfaceContainerHigh hover:bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:text-white font-medium text-xs transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                  <span>Download</span>
                </button>
                <button type="button" onclick="previewSnippet('${cardId}')" 
                  class="px-3.5 py-1.5 rounded-full bg-m3-primary hover:opacity-90 text-m3-surface font-semibold text-xs transition flex items-center gap-1.5 active:scale-95 shadow-sm cursor-pointer">
                  <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  <span>Live Preview</span>
                </button>
              </div>
            </div>
          `;
          parsedHtml += artifactPill;
        }
      }

      if (msgId) {
        const actionToolbar = `
          <div class="flex items-center gap-1 mt-2 text-[11px] text-m3-onSurfaceVariant/80">
            <button type="button" onclick="readAloudMessage('${msgId}', this)" class="px-2 py-1 rounded-md hover:bg-m3-surfaceContainerHigh hover:text-m3-onSurface transition flex items-center gap-1 cursor-pointer" title="Read response aloud">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
              <span>Speak</span>
            </button>
            <button type="button" onclick="copyFullMessage('${msgId}')" class="px-2 py-1 rounded-md hover:bg-m3-surfaceContainerHigh hover:text-m3-onSurface transition flex items-center gap-1 cursor-pointer" title="Copy response">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span>Copy</span>
            </button>
            <button type="button" onclick="downloadMessageFile('${msgId}')" class="px-2 py-1 rounded-md hover:bg-m3-surfaceContainerHigh hover:text-m3-onSurface transition flex items-center gap-1 cursor-pointer" title="Export as standalone HTML">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span>Download HTML</span>
            </button>
          </div>
        `;
        parsedHtml += actionToolbar;
      }

      return thinkHtml + parsedHtml;
    }

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML.replace(/\n/g, "<br>");
    }

    function appendMessageUI(role, content, isMarkdown = false) {
      const container = document.getElementById("chat-container");
      const msgId = "msg-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4);
      const isUser = role === "user";

      rawMessageStore[msgId] = content;

      let bodyHtml = "";
      if (isUser) {
        bodyHtml = escapeHtml(content);
      } else {
        bodyHtml = isMarkdown ? renderResponseWithArtifacts(content, msgId) : content;
      }

      const html = `
        <div id="${msgId}" class="flex gap-2.5 sm:gap-3 items-start msg-fade-in ${isUser ? 'flex-row-reverse' : ''}">
          <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 mt-0.5 ${isUser ? 'bg-m3-surfaceContainerHigh text-m3-onSurface' : 'bg-m3-surfaceContainerHighest text-m3-primary shadow-sm'}">
            ${isUser ? 
              `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` : 
              `<svg class="w-3.5 h-3.5" viewBox="0 0 32 32" fill="none"><path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
          </div>
          <div class="${isUser ? 'bg-m3-surfaceContainerHigh text-m3-onSurface rounded-2xl rounded-tr-sm px-3.5 py-2 text-[14px] font-medium max-w-[80%] sm:max-w-[70%] break-words shadow-sm leading-relaxed' : 'prose-readable text-m3-onSurface leading-relaxed max-w-full flex-1'}">
            ${bodyHtml}
          </div>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", html);
      const el = document.getElementById(msgId);
      if (isMarkdown && !isUser) {
        enhanceCodeBlocksInElement(el, msgId);
        renderMathInMsg(el);
      }
      return msgId;
    }

    function updateMessageUI(msgId, content) {
      const el = document.getElementById(msgId);
      if (el) {
        el.querySelector("div:last-child").innerHTML = content;
        renderMathInMsg(el);
      }
    }

    renderSidebarHistory();
    checkBackendStatus();
  </script>
</body>
</html>
