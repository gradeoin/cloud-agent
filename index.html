<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuckBuck AI • Enterprise Neural Workspace</title>
  
  <!-- Dynamic SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2338bdf8'/><stop offset='50%' stop-color='%23818cf8'/><stop offset='100%' stop-color='%23c084fc'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='%23131314'/><path d='M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6' stroke='url(%23g)' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <!-- Google Fonts: Google Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Markdown & Code Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- KaTeX LaTeX Math Typesetting Engine -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            m3: {
              surface: '#131314',
              surfaceContainerLow: '#18181a',
              surfaceContainer: '#1e1f20',
              surfaceContainerHigh: '#282a2c',
              surfaceContainerHighest: '#333538',
              primary: '#a8c7fa',
              primaryContainer: '#0842a0',
              onSurface: '#e3e3e3',
              onSurfaceVariant: '#c4c7c5',
              outline: '#444746',
              outlineVariant: '#282a2c',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 100% INVISIBLE SCROLLBARS WORLDWIDE WHILE PRESERVING SMOOTH SCROLL */
    *, *::before, *::after {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0px !important;
      height: 0px !important;
      background: transparent !important;
    }
    
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    
    /* ENHANCED READABLE FULL-WIDTH TYPOGRAPHY */
    .prose-readable {
      font-size: 15.5px;
      line-height: 1.75;
      color: #e3e3e3;
      width: 100%;
    }
    .prose-readable p {
      margin-bottom: 1.15em;
    }
    .prose-readable h1, .prose-readable h2, .prose-readable h3, .prose-readable h4 {
      color: #f1f3f4;
      font-weight: 600;
      margin-top: 1.4em;
      margin-bottom: 0.6em;
      letter-spacing: -0.01em;
    }
    .prose-readable h1 { font-size: 1.45em; color: #a8c7fa; }
    .prose-readable h2 { font-size: 1.25em; border-bottom: 1px solid rgba(68, 71, 70, 0.35); padding-bottom: 0.35em; }
    .prose-readable h3 { font-size: 1.1em; }
    .prose-readable ul, .prose-readable ol {
      margin-bottom: 1.15em;
      padding-left: 1.35em;
    }
    .prose-readable ul { list-style-type: disc; }
    .prose-readable ol { list-style-type: decimal; }
    .prose-readable li {
      margin-bottom: 0.45em;
    }
    .prose-readable blockquote {
      border-left: 3px solid #a8c7fa;
      background: rgba(168, 199, 250, 0.06);
      padding: 10px 16px;
      border-radius: 0 14px 14px 0;
      margin: 1.2em 0;
      color: #c4c7c5;
    }
    .prose-readable strong {
      color: #ffffff;
      font-weight: 600;
    }
    .prose-readable table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
      font-size: 0.9em;
    }
    .prose-readable th, .prose-readable td {
      border: 1px solid #282a2c;
      padding: 8px 12px;
      text-align: left;
    }
    .prose-readable th {
      background: #1e1f20;
      color: #a8c7fa;
      font-weight: 600;
    }
    
    .prose pre { background: #18181a !important; border: 1px solid #282a2c; padding: 14px; margin: 0 0 14px 0; border-radius: 16px; overflow-x: auto; }
    .prose code { color: #a8c7fa; font-family: 'JetBrains Mono', monospace; font-size: 0.88em; }
    .cursor-blink { display: inline-block; width: 6px; height: 15px; background: #a8c7fa; animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    
    .katex-display { margin: 1em 0; overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
    .katex { font-size: 1.08em; color: #e3e3e3; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 12px rgba(168, 199, 250, 0.4)); } 50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(168, 199, 250, 0.7)); } }

    .msg-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    .anim-spin { animation: spin-slow 10s linear infinite; }
    .anim-float { animation: float-slow 4s ease-in-out infinite; }
    .anim-glow { animation: pulse-glow 3s ease-in-out infinite; }

    #sidebar {
      width: 260px;
      min-width: 260px;
      transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
    }
    #sidebar.sidebar-hidden {
      width: 0px !important;
      min-width: 0px !important;
      border-right: none !important;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
  </style>
</head>
<body class="bg-m3-surface text-m3-onSurface flex h-screen w-screen overflow-hidden font-sans antialiased selection:bg-m3-primary/30 selection:text-m3-primary" onclick="closeAllDropdowns(event)">

  <!-- SILENT INITIAL AUTH CHECK LOADER -->
  <div id="auth-loading-screen" class="fixed inset-0 bg-m3-surface z-50 flex flex-col items-center justify-center space-y-4">
    <div class="w-14 h-14 rounded-2xl bg-m3-surfaceContainerHigh flex items-center justify-center shadow-xl anim-float">
      <svg class="w-7 h-7 text-m3-primary anim-glow" viewBox="0 0 32 32" fill="none">
        <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="flex items-center gap-2 text-xs text-m3-onSurfaceVariant font-medium">
      <svg class="w-4 h-4 text-m3-primary anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg>
      <span>Initializing workspace...</span>
    </div>
  </div>

  <!-- GOOGLE LOGIN SCREEN (Overlay) -->
  <div id="auth-overlay" class="fixed inset-0 bg-m3-surface/95 backdrop-blur-xl z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-m3-surfaceContainer border border-m3-outline/40 w-full max-w-sm rounded-[32px] p-8 shadow-2xl text-center space-y-6">
      
      <!-- Logo -->
      <div class="w-16 h-16 rounded-2xl bg-m3-surfaceContainerHigh border border-m3-outline/30 flex items-center justify-center mx-auto shadow-xl anim-float">
        <svg class="w-8 h-8 text-m3-primary anim-glow" viewBox="0 0 32 32" fill="none">
          <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div>
        <h2 class="text-xl font-semibold text-m3-onSurface tracking-tight">BuckBuck AI</h2>
        <p class="text-xs text-m3-onSurfaceVariant mt-1">Enterprise Neural Workspace</p>
      </div>

      <div id="auth-error-msg" class="hidden text-xs bg-rose-500/10 text-rose-300 border border-rose-500/20 p-3 rounded-2xl text-left font-medium"></div>

      <button id="google-login-btn" onclick="handleGoogleSignIn()" class="w-full bg-white hover:bg-slate-100 active:scale-95 text-slate-900 font-medium py-3 px-4 rounded-full text-sm flex items-center justify-center gap-3 transition shadow-md">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.4 8.9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
          <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.6 6.4C.6 8.3 0 10.5 0 12s.6 3.7 1.6 5.6l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.4-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- COLLAPSIBLE GOOGLE MATERIAL 3 SIDEBAR -->
  <aside id="sidebar" class="bg-m3-surfaceContainerLow border-r border-m3-outline/20 flex flex-col z-30 shrink-0 md:static fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 overflow-hidden select-none">
    
    <!-- Unified Sidebar Header -->
    <div class="px-3.5 py-3 flex items-center gap-2.5 min-w-[260px]">
      <button onclick="toggleSidebar()" class="text-m3-onSurfaceVariant hover:text-m3-onSurface p-2 rounded-full hover:bg-m3-surfaceContainer transition" title="Collapse sidebar">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-m3-surfaceContainerHigh flex items-center justify-center text-m3-primary shrink-0 shadow-sm">
          <svg class="w-3.5 h-3.5" viewBox="0 0 32 32" fill="none">
            <path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="font-semibold text-sm tracking-tight text-m3-onSurface whitespace-nowrap">BuckBuck</span>
      </div>
    </div>

    <!-- M3 Pill "New Chat" Action -->
    <div class="px-3 py-1.5 min-w-[260px]">
      <button onclick="startNewChat()" class="w-full bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh text-m3-onSurface hover:text-white font-medium px-4 py-2.5 rounded-full text-xs flex items-center gap-3 transition shadow-sm border border-m3-outline/30 active:scale-98 whitespace-nowrap">
        <svg class="w-4 h-4 text-m3-primary shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>
    </div>

    <!-- Conversation History List -->
    <div class="flex-1 overflow-y-auto px-2 py-2 space-y-0.5 min-w-[260px]" id="chat-history-list">
      <div class="text-[11px] font-medium text-m3-onSurfaceVariant px-3 py-1.5 whitespace-nowrap">Recent</div>
      <div id="history-items" class="space-y-0.5"></div>
    </div>

    <!-- M3 Account Footer -->
    <div class="p-2 border-t border-m3-outline/20 bg-m3-surfaceContainerLow min-w-[260px]">
      <div class="flex items-center justify-between p-2 rounded-2xl bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh transition">
        <div class="flex items-center gap-2.5 min-w-0">
          <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="w-7 h-7 rounded-full bg-m3-surfaceContainerHighest border border-m3-outline/30 shrink-0">
          <div class="min-w-0">
            <div id="user-name" class="font-medium text-xs text-m3-onSurface truncate">Admin</div>
            <div id="firebase-status" class="text-[10px] text-m3-onSurfaceVariant truncate">Firestore synced</div>
          </div>
        </div>
        <button onclick="handleSignOut()" class="text-m3-onSurfaceVariant hover:text-rose-400 p-1.5 rounded-full hover:bg-m3-surfaceContainerHighest transition" title="Sign out">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Sidebar Overlay for Mobile -->
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden md:hidden"></div>

  <!-- MAIN CHAT & WORKSPACE AREA -->
  <div class="flex-1 flex flex-col h-screen w-full min-w-0 bg-m3-surface relative overflow-hidden">
    
    <!-- Main Header -->
    <header class="bg-m3-surface/80 backdrop-blur-md px-4 sm:px-8 py-2.5 flex justify-between items-center z-10 border-b border-m3-outline/10">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <!-- Hamburger Button -->
        <button id="main-hamburger-btn" onclick="toggleSidebar()" class="text-m3-onSurfaceVariant hover:text-m3-onSurface p-2 rounded-full hover:bg-m3-surfaceContainer transition hidden" title="Expand sidebar">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>

        <!-- INTERACTIVE MODEL SELECTOR DROPDOWN -->
        <div class="relative" onclick="event.stopPropagation()">
          <button onclick="toggleModelDropdown()" id="model-selector-btn" class="flex items-center gap-2 bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh border border-m3-outline/30 px-3.5 py-1.5 rounded-full text-xs font-medium text-m3-onSurface transition shadow-sm hover:scale-[1.02] active:scale-95">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="current-model-display">DeepSeek-R1 (7B)</span>
            <svg class="w-3.5 h-3.5 text-m3-onSurfaceVariant transition-transform" id="model-dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <!-- Model Menu Options -->
          <div id="model-dropdown-menu" class="hidden absolute top-full left-0 mt-2 w-72 bg-m3-surfaceContainer border border-m3-outline/40 rounded-2xl p-1.5 shadow-2xl z-50 space-y-1 backdrop-blur-xl">
            <div class="text-[10px] uppercase font-bold text-m3-onSurfaceVariant/70 px-3 pt-2 pb-1 tracking-wider">Select AI Model</div>
            
            <button onclick="selectModel('deepseek-r1:7b', 'DeepSeek-R1 (7B)')" class="w-full text-left p-2.5 rounded-xl hover:bg-m3-surfaceContainerHigh transition flex items-center justify-between group">
              <div>
                <div class="font-medium text-xs text-m3-onSurface flex items-center gap-1.5">
                  <span>DeepSeek-R1 (7B)</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-normal">Reasoning</span>
                </div>
                <div class="text-[11px] text-m3-onSurfaceVariant mt-0.5">Deep logic, math proofs & architecture</div>
              </div>
            </button>

            <button onclick="selectModel('qwen2.5:7b', 'Qwen 2.5 (7B)')" class="w-full text-left p-2.5 rounded-xl hover:bg-m3-surfaceContainerHigh transition flex items-center justify-between group">
              <div>
                <div class="font-medium text-xs text-m3-onSurface flex items-center gap-1.5">
                  <span>Qwen 2.5 (7B)</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-normal">⚡ Instant</span>
                </div>
                <div class="text-[11px] text-m3-onSurfaceVariant mt-0.5">Fast conversational & full coding (0s delay)</div>
              </div>
            </button>

            <button onclick="selectModel('deepseek-r1:1.5b', 'DeepSeek-R1 (1.5B)')" class="w-full text-left p-2.5 rounded-xl hover:bg-m3-surfaceContainerHigh transition flex items-center justify-between group">
              <div>
                <div class="font-medium text-xs text-m3-onSurface flex items-center gap-1.5">
                  <span>DeepSeek-R1 (1.5B)</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-normal">⚡ Fast</span>
                </div>
                <div class="text-[11px] text-m3-onSurfaceVariant mt-0.5">Lightweight instant reasoning (80 tok/s)</div>
              </div>
            </button>

            <button onclick="selectModel('llama3.1:8b', 'Llama 3.1 (8B)')" class="w-full text-left p-2.5 rounded-xl hover:bg-m3-surfaceContainerHigh transition flex items-center justify-between group">
              <div>
                <div class="font-medium text-xs text-m3-onSurface flex items-center gap-1.5">
                  <span>Llama 3.1 (8B)</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 font-normal">Chat</span>
                </div>
                <div class="text-[11px] text-m3-onSurfaceVariant mt-0.5">Meta's friendly general assistant</div>
              </div>
            </button>
          </div>
        </div>

        <span id="status-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium hidden sm:inline">T4 GPU</span>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Live Search Pill -->
        <label class="flex items-center gap-2 cursor-pointer bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh border border-m3-outline/30 px-3 py-1.5 rounded-full transition text-xs select-none shadow-sm hover:scale-[1.02] active:scale-95">
          <svg class="w-3.5 h-3.5 text-m3-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>

        <button onclick="toggleArtifactDrawerQuick()" class="text-xs bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh border border-m3-outline/30 px-3 py-1.5 rounded-full text-m3-primary font-medium transition flex items-center gap-1.5 hover:scale-105 active:scale-95 shadow-sm" title="Open Artifact Studio">

          <span class="hidden sm:inline">Artifacts</span>
        </button>

        <!-- Export Chat as HTML -->
        <button onclick="exportChatAsHTML()" class="text-xs bg-m3-surfaceContainer hover:bg-m3-surfaceContainerHigh border border-m3-outline/30 p-2 rounded-full text-m3-onSurfaceVariant hover:text-m3-onSurface transition hover:scale-105 active:scale-95" title="Export conversation as HTML document">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>

  <!-- Application Logic -->
  <script>
    const defaultFirebaseConfig = {
      apiKey: "AIzaSyA_sMdU-ahrAdQYiZkYCQZGk9RopwFh1w0",
      authDomain: "buckbuck-ab0ff.firebaseapp.com",
      projectId: "buckbuck-ab0ff",
      storageBucket: "buckbuck-ab0ff.firebasestorage.app",
      messagingSenderId: "353819317007",
      appId: "1:353819317007:web:1ea90af6b195401ea0e47a",
      measurementId: "G-HDTY2CLWSL"
    };

    let backendUrl = localStorage.getItem("ai_backend_url") || "https://promo-argued-induced-positions.trycloudflare.com";
    let modelName = localStorage.getItem("ai_model_name") || "deepseek-r1:7b";
    let allowedEmail = localStorage.getItem("ai_allowed_email") || "";
    let currentChatId = getChatIdFromURL() || "chat_" + Date.now();
    let db = null, auth = null, currentUser = null;
    let conversations = JSON.parse(localStorage.getItem("ai_conversations") || "{}");
    let currentAttachedFile = null;
    let activeArtifactCode = "";
    let activeArtifactTitle = "Artifact Preview";
    let activeArtifactLang = "html";
    const rawMessageStore = {};

    const EXT_MAP = {
      python: 'py', py: 'py', javascript: 'js', js: 'js', jsx: 'jsx', typescript: 'ts', ts: 'ts', tsx: 'tsx',
      html: 'html', htm: 'html', css: 'css', json: 'json', markdown: 'md', md: 'md',
      sql: 'sql', bash: 'sh', sh: 'sh', shell: 'sh', svg: 'svg', xml: 'xml',
      c: 'c', cpp: 'cpp', rust: 'rs', rs: 'rs', java: 'java', go: 'go', csv: 'csv', text: 'txt'
    };

    function toggleModelDropdown() {
      const menu = document.getElementById("model-dropdown-menu");
      const arrow = document.getElementById("model-dropdown-arrow");
      menu.classList.toggle("hidden");
      if (!menu.classList.contains("hidden")) {
        arrow.classList.add("rotate-180");
      } else {
        arrow.classList.remove("rotate-180");
      }
    }

    function closeAllDropdowns() {
      const menu = document.getElementById("model-dropdown-menu");
      const arrow = document.getElementById("model-dropdown-arrow");
      if (menu && !menu.classList.contains("hidden")) {
        menu.classList.add("hidden");
        arrow.classList.remove("rotate-180");
      }
    }

    function selectModel(tag, label) {
      modelName = tag;
      localStorage.setItem("ai_model_name", modelName);
      document.getElementById("model-name-input").value = modelName;
      document.getElementById("current-model-display").textContent = label;
      closeAllDropdowns();
    }

    function updateModelDisplayFromStorage() {
      const map = {
        "deepseek-r1:7b": "DeepSeek-R1 (7B)",
        "qwen2.5:7b": "Qwen 2.5 (7B)",
        "llama3.1:8b": "Llama 3.1 (8B)",
        "deepseek-r1:1.5b": "DeepSeek-R1 (1.5B)"
      };
      const label = map[modelName] || modelName;
      document.getElementById("current-model-display").textContent = label;
    }

    function getChatIdFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get('c');
      if (queryId) return queryId;
      const hashMatch = window.location.hash.match(/#\/?c\/(.+)/);
      if (hashMatch) return hashMatch[1];
      return null;
    }

    function updateChatURL(chatId) {
      if (!chatId) {
        window.history.pushState({}, "", window.location.pathname);
      } else {
        window.history.pushState({ chatId }, "", `?c=${chatId}`);
      }
    }

    window.addEventListener('popstate', (e) => {
      const idFromURL = getChatIdFromURL();
      if (idFromURL && conversations[idFromURL]) {
        loadChatSession(idFromURL, false);
      } else if (!idFromURL) {
        startNewChat(false);
      }
    });

    // SMART AUTO-SCROLL
    let isUserScrolledUp = false;
    const chatContainer = document.getElementById("chat-container");
    const scrollBottomBtn = document.getElementById("scroll-bottom-container");

    chatContainer.addEventListener("scroll", function() {
      const threshold = 140;
      const isAtBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight <= threshold;
      isUserScrolledUp = !isAtBottom;
      if (isUserScrolledUp) {
        scrollBottomBtn.classList.remove("hidden");
      } else {
        scrollBottomBtn.classList.add("hidden");
      }
    });

    function scrollToBottom(force = false) {
      if (!isUserScrolledUp || force) {
        chatContainer.scrollTo({
          top: chatContainer.scrollHeight,
          behavior: force ? 'smooth' : 'auto'
        });
        if (force) {
          isUserScrolledUp = false;
          scrollBottomBtn.classList.add("hidden");
        }
      }
    }

    document.getElementById("backend-url-input").value = backendUrl;
    document.getElementById("model-name-input").value = modelName;
    document.getElementById("allowed-email-input").value = allowedEmail;
    updateModelDisplayFromStorage();

    // PERSISTENT AUTHENTICATION
    function initFirebase() {
      try {
        if (!firebase.apps.length) firebase.initializeApp(defaultFirebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();

        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(() => {
          auth.onAuthStateChanged(user => {
            document.getElementById("auth-loading-screen").classList.add("hidden");
            if (user) {
              if (allowedEmail && user.email.toLowerCase() !== allowedEmail.toLowerCase()) {
                showAuthError(`Access Denied: ${user.email} is not authorized.`);
                auth.signOut();
                return;
              }
              if (!allowedEmail) {
                allowedEmail = user.email.toLowerCase();
                localStorage.setItem("ai_allowed_email", allowedEmail);
                document.getElementById("allowed-email-input").value = allowedEmail;
              }
              currentUser = user;
              document.getElementById("auth-overlay").classList.add("hidden");
              document.getElementById("user-name").textContent = user.displayName || user.email;
              if (user.photoURL) document.getElementById("user-avatar").src = user.photoURL;
              
              loadFirestoreConversations();
            } else {
              currentUser = null;
              document.getElementById("auth-overlay").classList.remove("hidden");
            }
          });
        });

      } catch (e) {
        console.warn("Firebase note:", e);
        document.getElementById("auth-loading-screen").classList.add("hidden");
      }
    }
    initFirebase();

    function handleGoogleSignIn() {
      const provider = new firebase.auth.GoogleAuthProvider();
      hideAuthError();
      auth.signInWithPopup(provider).catch(err => {
        showAuthError(err.message || "Failed to sign in with Google.");
      });
    }

    function handleSignOut() { auth.signOut(); }
    function showAuthError(msg) {
      const errBox = document.getElementById("auth-error-msg");
      errBox.textContent = msg;
      errBox.classList.remove("hidden");
    }
    function hideAuthError() { document.getElementById("auth-error-msg").classList.add("hidden"); }

    const promptInput = document.getElementById("prompt-input");
    promptInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });
    promptInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // UNIFIED SIDEBAR TOGGLE
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      const mainHamburger = document.getElementById("main-hamburger-btn");
      
      if (window.innerWidth >= 768) {
        sidebar.classList.toggle("sidebar-hidden");
        const isHidden = sidebar.classList.contains("sidebar-hidden");
        if (isHidden) {
          mainHamburger.classList.remove("hidden");
        } else {
          mainHamburger.classList.add("hidden");
        }
      } else {
        sidebar.classList.toggle("-translate-x-full");
        overlay.classList.toggle("hidden");
      }
    }

    function toggleSettingsModal() {
      document.getElementById("settings-modal").classList.toggle("hidden");
    }

    function saveSettings() {
      backendUrl = document.getElementById("backend-url-input").value.trim().replace(/\/$/, "");
      modelName = document.getElementById("model-name-input").value.trim();
      allowedEmail = document.getElementById("allowed-email-input").value.trim().toLowerCase();

      localStorage.setItem("ai_backend_url", backendUrl);
      localStorage.setItem("ai_model_name", modelName);
      localStorage.setItem("ai_allowed_email", allowedEmail);

      updateModelDisplayFromStorage();
      toggleSettingsModal();
      checkBackendStatus();
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        currentAttachedFile = {
          name: file.name,
          size: (file.size / 1024).toFixed(1) + " KB",
          content: evt.target.result
        };
        document.getElementById("attached-file-name").textContent = `${currentAttachedFile.name} (${currentAttachedFile.size})`;
        document.getElementById("file-attachment-chip").classList.remove("hidden");
      };
      reader.readAsText(file);
    }

    function removeAttachedFile() {
      currentAttachedFile = null;
      document.getElementById("file-attachment-chip").classList.add("hidden");
      document.getElementById("file-upload-input").value = "";
    }

    // CLAUDE ARTIFACTS & FULL PREVIEW SYSTEM
    function toggleArtifactDrawerQuick() {
      const drawer = document.getElementById("artifact-drawer");
      if (drawer.classList.contains("hidden")) {
        if (!activeArtifactCode) {
          openArtifactDrawer("Interactive Canvas", `
            <div style="font-family: sans-serif; padding: 40px; text-align: center; color: #1e1f20;">
              <h2>🎨 BuckBuck Live Artifact Canvas</h2>
              <p>Ask the AI to generate code, web apps, diagrams, or components, and preview them live here!</p>
            </div>
          `, "html");
        } else {
          drawer.classList.remove("hidden", "pointer-events-none");
          setTimeout(() => drawer.classList.remove("translate-x-full"), 10);
        }
      } else {
        closeArtifactDrawer();
      }
    }

    function openArtifactDrawer(title, code, lang = "html") {
      activeArtifactCode = code;
      activeArtifactTitle = title || "Artifact Preview";
      activeArtifactLang = lang.toLowerCase();

      document.getElementById("artifact-title").textContent = activeArtifactTitle;
      
      const iframe = document.getElementById("artifact-iframe");
      
      if (['html', 'htm', 'svg', 'xml', 'javascript', 'js', 'jsx'].includes(activeArtifactLang)) {

    async function searchDuckDuckGo(query) {
      try {
        const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
        const data = await res.json();
        let context = "";
        if (data.AbstractText) context += `Summary: ${data.AbstractText}\n`;
        if (data.RelatedTopics && data.RelatedTopics.length > 0) {
          context += "Related Search Results:\n";
          data.RelatedTopics.slice(0, 3).forEach(t => { if (t.Text) context += `- ${t.Text}\n`; });
        }
        return context.trim();
      } catch (err) { return ""; }
    }

    // MULTI-TURN CONVERSATIONAL CHAT ENGINE
    async function handleSend() {
      const text = promptInput.value.trim();
      if (!text && !currentAttachedFile) return;

      const isWebSearch = document.getElementById("websearch-toggle").checked;
      promptInput.value = "";
      promptInput.style.height = "auto";

      let userDisplayContent = text;
      if (currentAttachedFile) {
        userDisplayContent = `[Attached File: ${currentAttachedFile.name}]\n\n${text}`;
      }

      appendMessageUI("user", userDisplayContent, true);

      let finalPrompt = text;
      if (currentAttachedFile) {
        finalPrompt = `[Attached File: ${currentAttachedFile.name}]\n\`\`\`\n${currentAttachedFile.content}\n\`\`\`\n\n[User Instruction]:\n${text || 'Please analyze this document.'}`;
        removeAttachedFile();
      }

      const existingHistory = conversations[currentChatId]?.messages || [];
      const recentHistory = existingHistory.slice(-4);

      const historyPayload = recentHistory.map(m => {
        let cleanContent = m.content;
        if (m.role === 'assistant') {
          cleanContent = cleanContent.replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, "").trim();
        }
        return {
          role: m.role === 'user' ? 'user' : 'assistant',
          content: cleanContent
        };
      });

      historyPayload.push({
        role: "user",
        content: finalPrompt
      });

      saveMessageToHistory("user", userDisplayContent);

      const aiMsgId = appendMessageUI("assistant", '<div class="flex items-center gap-2.5 text-m3-primary font-medium text-xs"><svg class="w-4 h-4 anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg> Starting neural engine...</div>', false);
      
      setTimeout(() => {
        const el = document.getElementById(aiMsgId);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, 40);

      if (isWebSearch) {
        updateMessageUI(aiMsgId, '<div class="flex items-center gap-2.5 text-m3-primary font-medium text-xs"><svg class="w-4 h-4 anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg> Searching web for context...</div>');
        const searchResults = await searchDuckDuckGo(text);
        if (searchResults) {
          historyPayload[historyPayload.length - 1].content = `[Live Web Search Context]:\n${searchResults}\n\n[User Question]:\n${finalPrompt}\n\nAnswer concisely using search context above.`;
        }
      }

      const isR1 = modelName.includes("r1");
      let messagesPayload = historyPayload;

      if (!isR1) {
        const now = new Date();
        const dateString = now.toLocaleDateString(undefined, { 
          weekday: 'long', 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        const systemPrompt = {
          role: "system",
          content: `You are BuckBuck AI, an intelligent, helpful, and concise neural assistant.
Current Date: ${dateString}, ${timeString} (${timezone}).
Directives:
- Respond directly and helpfully.
- When generating code, HTML, Python, components or files, always enclose them in clean fenced code blocks with language identifiers.
- Format formulas in LaTeX ($...$ and $$...$$).`
        };
        messagesPayload = [systemPrompt, ...historyPayload];
      }

      try {
        updateMessageUI(aiMsgId, '<span class="text-m3-onSurfaceVariant text-xs italic">Streaming tokens...</span><span class="cursor-blink"></span>');

        const response = await fetch(`${backendUrl}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: modelName,
            messages: messagesPayload,
            stream: true,
            options: {
              num_gpu: 99,
              num_ctx: 2048,
              num_batch: 512,
              temperature: 0.6,
              top_p: 0.9,
              num_predict: 1024
            }
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let accumulatedText = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n").filter(l => l.trim().length > 0);

          for (const line of lines) {
            try {
              const parsed = JSON.parse(line);
              if (parsed.message && parsed.message.content) {
                accumulatedText += parsed.message.content;
                rawMessageStore[aiMsgId] = accumulatedText;
                updateMessageUI(aiMsgId, renderResponseWithArtifacts(accumulatedText, aiMsgId) + '<span class="cursor-blink"></span>');
                scrollToBottom(false);
              }
            } catch (e) {}
          }
        }

        rawMessageStore[aiMsgId] = accumulatedText;
        updateMessageUI(aiMsgId, renderResponseWithArtifacts(accumulatedText, aiMsgId));
        const aiMsgElement = document.getElementById(aiMsgId);
        enhanceCodeBlocksInElement(aiMsgElement);
        renderMathInMsg(aiMsgElement);
        saveMessageToHistory("assistant", accumulatedText);
        scrollToBottom(false);

      } catch (error) {
        updateMessageUI(aiMsgId, `<p class="text-rose-400 text-xs">Could not reach Colab GPU backend. Make sure Colab is active and model is pulled.</p>`);
      }
    }

    function renderMathInMsg(element) {
      if (!element || !window.renderMathInElement) return;
      renderMathInElement(element, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false}
        ],
        throwOnError: false
      });
    }

    function enhanceCodeBlocksInElement(containerEl) {
      if (!containerEl) return;
      const preElements = containerEl.querySelectorAll('pre');
      
      preElements.forEach(pre => {
        if (pre.previousElementSibling && pre.previousElementSibling.classList.contains('code-header-bar')) return;

        const codeEl = pre.querySelector('code');
        if (!codeEl) return;

        const langMatch = codeEl.className.match(/language-(\w+)/);
        const lang = langMatch ? langMatch[1] : 'code';
        const rawCode = codeEl.innerText;
        const encodedCode = encodeURIComponent(rawCode);
        const ext = EXT_MAP[lang.toLowerCase()] || 'txt';
        const filename = `snippet_${Date.now()}.${ext}`;

        const header = document.createElement('div');
        header.className = 'code-header-bar flex items-center justify-between px-4 py-2 bg-[#1e1f20] border-t border-x border-[#282a2c] text-[11px] text-m3-onSurfaceVariant font-mono rounded-t-2xl';
        
        let previewBtn = `
          <button onclick="openArtifactDrawer('${lang.toUpperCase()} Canvas', decodeURIComponent('${encodedCode}'), '${lang}')" 
            class="hover:text-m3-primary flex items-center gap-1.5 text-xs font-sans font-medium text-m3-primary transition" title="Preview / Run in Sandbox">
            <svg class="w-3.5 h-3.5 text-m3-primary fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Preview</span>
          </button>
        `;

        header.innerHTML = `
          <span class="text-m3-onSurfaceVariant font-bold uppercase tracking-wider text-[10px]">${lang}</span>
          <div class="flex items-center gap-3">
            ${previewBtn}
            <button onclick="downloadFileContent(decodeURIComponent('${encodedCode}'), '${filename}', '${ext === 'html' ? 'text/html' : 'text/plain'}')" 
              class="hover:text-white flex items-center gap-1 text-xs font-sans font-medium text-m3-onSurfaceVariant transition" title="Download as ${filename}">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span>Download</span>
            </button>
            <button onclick="copyCodeText(this, decodeURIComponent('${encodedCode}'))" 
              class="hover:text-white flex items-center gap-1 text-xs font-sans font-medium text-m3-onSurfaceVariant transition" title="Copy code">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span>Copy</span>
            </button>
          </div>
        `;

        pre.parentNode.insertBefore(header, pre);
        pre.classList.add('rounded-t-none', 'mt-0', 'border-t-0');
        hljs.highlightElement(codeEl);
      });
    }

    function renderResponseWithArtifacts(text, msgId = "") {
      let thinkHtml = "";
      let mainText = text;

      const thinkMatch = text.match(/<think>([\s\S]*?)(?:<\/think>|$)/i);
      if (thinkMatch) {
        const thinkContent = thinkMatch[1].trim();
        const isStillThinking = !text.includes("</think>");
        mainText = text.replace(/<think>[\s\S]*?(?:<\/think>|$)/i, "").trim();

        if (isStillThinking) {
          thinkHtml = `
            <div class="mb-4 bg-m3-surfaceContainerLow border border-m3-outline/30 rounded-2xl p-3.5 shadow-sm">
              <div class="flex items-center gap-2 text-xs font-medium text-m3-primary mb-2">
                <svg class="w-3.5 h-3.5 anim-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="12"/></svg>
                Thinking in real-time...
              </div>
              <div class="text-xs text-m3-onSurfaceVariant/90 font-mono whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto">
                ${thinkContent || 'Generating initial reasoning tokens...'}
              </div>
            </div>
          `;
        } else if (thinkContent.length > 0) {
          thinkHtml = `
            <details class="mb-4 bg-m3-surfaceContainerLow border border-m3-outline/20 rounded-2xl overflow-hidden group shadow-sm">
              <summary class="px-4 py-2.5 cursor-pointer font-medium text-xs text-m3-primary flex items-center justify-between select-none hover:bg-m3-surfaceContainer transition">
                <span class="flex items-center gap-2">
                  <svg class="w-3.5 h-3.5 text-m3-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 00-8 8c0 3 2 5.5 4 7v3h8v-3c2-1.5 4-4 4-7a8 8 0 00-8-8z"/><path d="M9 22h6"/></svg>
                  Thought Process (${Math.max(1, Math.round(thinkContent.split(' ').length / 20))}s)
                </span>
                <svg class="w-3.5 h-3.5 text-m3-onSurfaceVariant transition-transform group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>
              </summary>
              <div class="px-4 py-3 border-t border-m3-outline/20 text-xs text-m3-onSurfaceVariant/85 font-mono whitespace-pre-wrap leading-relaxed bg-[#151517]">
                ${thinkContent}
              </div>
            </details>
          `;
        }
      }

      let normalized = mainText
        .replace(/\[\s*(\\text|\\boxed|\\begin|\\frac|\\sum|\\int|\\sqrt|\\alpha|\\beta|\\gamma|\\theta|\\lambda|\\sigma|\\omega|\\mathbf|\\mathcal|\\left|\\mathbf|Attention)[\s\S]*?\]/g, match => {
          return `\n$$\n${match.slice(1, -1).trim()}\n$$\n`;
        })
        .replace(/\(\s*([QKVqkvi-z0-9\\]+)\s*\)/g, (match, p1) => {
          if (p1.length <= 4 || p1.startsWith('\\')) return `$${p1}$`;
          return match;
        });

      let parsedHtml = marked.parse(normalized);

      const codeMatch = mainText.match(/```(\w+)?\n([\s\S]*?)```/);
      if (codeMatch && codeMatch[2].trim().length > 40) {
        const lang = (codeMatch[1] || 'code').toLowerCase();
        const rawCode = codeMatch[2].trim();
        const encodedCode = encodeURIComponent(rawCode);
        const ext = EXT_MAP[lang] || 'txt';
        const autoFilename = `generated_file_${Date.now()}.${ext}`;

        const artifactPill = `
          <div class="mt-4 p-3.5 rounded-2xl bg-m3-surfaceContainer border border-m3-outline/30 flex items-center justify-between shadow-sm flex-wrap gap-2">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-lg bg-m3-surfaceContainerHighest text-m3-primary flex items-center justify-center">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
              </div>
              <div>
                <div class="font-medium text-xs text-m3-onSurface">${autoFilename}</div>
                <div class="text-[10px] text-m3-onSurfaceVariant">${lang.toUpperCase()} • ${(rawCode.length / 1024).toFixed(1)} KB</div>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="downloadFileContent(decodeURIComponent('${encodedCode}'), '${autoFilename}', '${ext === 'html' ? 'text/html' : 'text/plain'}')" 
                class="px-3 py-1.5 rounded-full bg-m3-surfaceContainerHigh hover:bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:text-white font-medium text-xs transition flex items-center gap-1.5 shadow-sm">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                Download
              </button>
              <button onclick="openArtifactDrawer('${autoFilename}', decodeURIComponent('${encodedCode}'), '${lang}')" 
                class="px-3.5 py-1.5 rounded-full bg-m3-primary hover:opacity-90 text-m3-surface font-semibold text-xs transition flex items-center gap-1.5 active:scale-95 shadow-sm">
                <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Live Preview
              </button>
            </div>
          </div>
        `;
        parsedHtml += artifactPill;
      }

      if (msgId) {
        const actionToolbar = `
          <div class="flex items-center gap-2 mt-3 pt-2 text-xs text-m3-onSurfaceVariant border-t border-m3-outline/10">
            <button onclick="copyFullMessage('${msgId}')" class="p-1.5 rounded-lg hover:bg-m3-surfaceContainerHigh hover:text-m3-onSurface transition flex items-center gap-1.5" title="Copy full response">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
              <span>Copy</span>
            </button>
            <button onclick="downloadMessageFile('${msgId}')" class="p-1.5 rounded-lg hover:bg-m3-surfaceContainerHigh hover:text-m3-onSurface transition flex items-center gap-1.5" title="Download response as formatted standalone HTML">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span>Download HTML</span>
            </button>
          </div>
        `;
        parsedHtml += actionToolbar;
      }

      return thinkHtml + parsedHtml;
    }

    function appendMessageUI(role, content, isMarkdown = false) {
      const container = document.getElementById("chat-container");
      const msgId = "msg-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4);
      const isUser = role === "user";

      rawMessageStore[msgId] = content;

      const html = `
        <div id="${msgId}" class="flex gap-3.5 sm:gap-4 items-start msg-fade-in ${isUser ? 'flex-row-reverse' : ''}">
          <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 mt-0.5 ${isUser ? 'bg-m3-surfaceContainerHigh text-m3-onSurface' : 'bg-m3-surfaceContainerHighest text-m3-primary shadow-sm'}">
            ${isUser ? 
              `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` : 
              `<svg class="w-3.5 h-3.5" viewBox="0 0 32 32" fill="none"><path d="M16 4L6 10l10 6 10-6-10-6zM6 16l10 6 10-6M6 22l10 6 10-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
          </div>
          <div class="max-w-[90%] ${isUser ? 'bg-m3-surfaceContainerHigh text-m3-onSurface rounded-3xl px-4 py-2.5 text-[15px] font-medium' : 'prose-readable text-m3-onSurface leading-relaxed'}">
            ${isMarkdown ? renderResponseWithArtifacts(content, msgId) : content}
          </div>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", html);
      const el = document.getElementById(msgId);
      if (isMarkdown && !isUser) {
        enhanceCodeBlocksInElement(el);
        renderMathInMsg(el);
      }
      return msgId;
    }

    function updateMessageUI(msgId, content) {
      const el = document.getElementById(msgId);
      if (el) {
        el.querySelector("div:last-child").innerHTML = content;
        renderMathInMsg(el);
      }
    }

    renderSidebarHistory();
    checkBackendStatus();
  </script>
</body>
</html>
